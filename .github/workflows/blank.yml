name: Debug with tmate
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30        # 👈 correct place
    steps:
      - uses: actions/checkout@v4
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
